<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Local Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090610;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body.idle {
      cursor: none;
    }

    /* Slideshow stage */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at center, #1a1029 0%, #090610 100%);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
      overflow: hidden;
    }

    .slide.first-load {
      transition: opacity 0.65s ease-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Ambient blurred color-matched backdrop (fills screen behind portrait shots) */
    .slide-backdrop {
      position: absolute;
      inset: -8%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: blur(42px) brightness(0.55) saturate(1.3);
      transform: scale(1.08);
    }

    /* Main foreground photo */
    .slide-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.55));
      transition: transform 11s ease-out;
    }

    /* Fill / cover mode option */
    body.mode-fill .slide-backdrop {
      display: none;
    }

    body.mode-fill .slide-img {
      object-fit: cover;
      filter: none;
    }

    body.mode-fill .slide.active .slide-img {
      transform: scale(1.04);
    }

    /* Subtle edge vignette for contrast */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 52%, rgba(6, 4, 12, 0.42) 100%),
        linear-gradient(to top, rgba(6, 4, 12, 0.5) 0%, transparent 26%, transparent 80%, rgba(6, 4, 12, 0.3) 100%);
    }

    /* Clock container & placement presets */
    #clock-wrap {
      position: fixed;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.15rem 2.2rem 1.3rem;
      border-radius: 26px;
      background: rgba(12, 8, 22, 0.46);
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: top 0.35s ease, bottom 0.35s ease, left 0.35s ease, right 0.35s ease, transform 0.35s ease;
    }

    /* Default: bottom-center so portrait faces in the middle stay clear */
    body.pos-bottom #clock-wrap {
      bottom: 5.5vh;
      left: 50%;
      transform: translateX(-50%);
    }

    body.pos-center #clock-wrap {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    body.pos-top #clock-wrap {
      top: 5vh;
      left: 50%;
      transform: translateX(-50%);
    }

    body.pos-corner #clock-wrap {
      bottom: 4.5vh;
      left: 4vw;
      align-items: flex-start;
      text-align: left;
      transform: none;
    }

    #time-row {
      display: flex;
      align-items: baseline;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    #time-hm {
      font-size: clamp(3.1rem, 7.2vw, 6.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    #time-sec {
      font-size: clamp(2.0rem, 4.5vw, 3.8rem);
      font-weight: 300;
      color: rgba(242, 234, 255, 0.92);
      letter-spacing: -0.01em;
      margin-left: 0.04em;
    }

    #time-ampm {
      font-size: clamp(1.05rem, 2vw, 1.65rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(226, 206, 255, 0.88);
      margin-left: 0.55rem;
    }

    #time-ampm:empty {
      display: none;
    }

    #date-row {
      margin-top: 0.45rem;
      font-size: clamp(0.92rem, 1.55vw, 1.22rem);
      font-weight: 400;
      letter-spacing: 0.035em;
      color: rgba(240, 234, 252, 0.84);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    }

    /* Auto-hiding discreet controls */
    #controls {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.38rem 0.55rem;
      border-radius: 999px;
      background: rgba(14, 10, 26, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body:not(.idle) #controls,
    #controls:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    .ctrl-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.88);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.36rem 0.6rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover,
    .ctrl-btn:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      outline: none;
    }

    .ctrl-sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 0.1rem;
    }

    @media (max-width: 640px) {
      #clock-wrap {
        padding: 0.95rem 1.45rem 1.05rem;
        border-radius: 22px;
        width: max-content;
        max-width: 92vw;
      }

      body.pos-bottom #clock-wrap,
      body.pos-corner #clock-wrap {
        left: 50%;
        bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
        align-items: center;
        text-align: center;
        transform: translateX(-50%);
      }

      #controls {
        left: 50%;
        right: auto;
        bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition: opacity 0.4s linear;
      }
      .slide-img {
        transition: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body class="pos-bottom">
  <div id="stage" aria-hidden="true">
    <div class="slide" id="slide-0">
      <div class="slide-backdrop"></div>
      <img class="slide-img" alt="" referrerpolicy="no-referrer">
    </div>
    <div class="slide" id="slide-1">
      <div class="slide-backdrop"></div>
      <img class="slide-img" alt="" referrerpolicy="no-referrer">

  </div>

  <div id="vignette" aria-hidden="true"></div>

  <main id="clock-wrap" aria-label="Live local time">
    <div id="time-row">

    </div>
    <div id="date-row">Loading local time...</div>
  </main>

  <nav id="controls" aria-label="Display controls">
    <button class="ctrl-btn" id="btn-prev" type="button" title="Previous photo (Left arrow)" aria-label="Previous photo">&#8249;</button>
    <button class="ctrl-btn" id="btn-play" type="button" title="Pause or resume slideshow (Space)" aria-label="Pause slideshow">&#10074;&#10074;</button>
    <button class="ctrl-btn" id="btn-next" type="button" title="Next photo (Right arrow)" aria-label="Next photo">&#8250;</button>
    <span class="ctrl-sep" aria-hidden="true"></span>
    <button class="ctrl-btn" id="btn-format" type="button" title="Toggle 12h / 24h clock (T)">12h</button>
    <button class="ctrl-btn" id="btn-fit" type="button" title="Toggle Fit vs Fill background (C)">Fit</button>
    <button class="ctrl-btn" id="btn-pos" type="button" title="Move clock position (P)">Bottom</button>
    <button class="ctrl-btn" id="btn-fs" type="button" title="Toggle fullscreen (F)" aria-label="Toggle fullscreen">&#x26F6;</button>
  </nav>

        try {

          hours = hours % 12 || 12;
          hmEl.textContent = hours + ":" + mins;
          ampmEl.textContent = ampm;
        }
        secEl.textContent = ":" + secs;

        const dateStr = dateFormatter.format(now);
        const tz = getTzShort(now);
        dateEl.textContent = tz ? dateStr + " · " + tz : dateStr;
        document.title = hmEl.textContent + ":" + secs + (ampmEl.textContent ? " " + ampmEl.textContent : "");
      }

      function scheduleClock() {
        clearTimeout(clockTimer);
        updateClock();
        const msUntilNextSecond = 1000 - (Date.now() % 1000) + 6;
        clockTimer = setTimeout(scheduleClock, msUntilNextSecond);
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          scheduleClock();
        }
      });

      // Shuffled deck of photo indices
      let deck = [];
      let deckPos = -1;
      let hasShownFirst = false;

      function buildShuffledDeck(avoidFirst) {
        const arr = PHOTO_IDS.map((_, idx) => idx);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        if (arr.length > 1 && arr[0] === avoidFirst) {
          [arr[0], arr[1]] = [arr[1], arr[0]];
        }
        return arr;
      }

      deck = buildShuffledDeck(-1);

      function getOptimalSizeSuffix() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const maxDim = Math.max(window.innerWidth || 1920, window.innerHeight || 1080) * dpr;
        const bucket = maxDim > 1440 ? 1920 : 1280;
        return "=w" + bucket + "-h" + bucket;
      }

      function photoUrl(index) {
        return BASE_URL + PHOTO_IDS[index] + getOptimalSizeSuffix();
      }

      let activeLayer = 1;
      let paused = false;
      let slideTimer = null;
      let transitionToken = 0;

      function preloadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.referrerPolicy = "no-referrer";
          img.onload = () => {
            if (typeof img.decode === "function") {
              img.decode().then(() => resolve(url)).catch(() => resolve(url));
            } else {
              resolve(url);
            }
          };
          img.onerror = reject;
          img.src = url;
        });
      }

      async function showDeckIndex(targetDeckPos, direction = 1, attempts = 0) {
        if (attempts >= PHOTO_IDS.length) return;
        const token = ++transitionToken;

        if (targetDeckPos >= deck.length) {
          const lastIdx = deck[deck.length - 1];
          deck = buildShuffledDeck(lastIdx);
          targetDeckPos = 0;
        } else if (targetDeckPos < 0) {
          targetDeckPos = deck.length - 1;
        }

        const photoIdx = deck[targetDeckPos];
        const url = photoUrl(photoIdx);

        try {
          await preloadImage(url);
        } catch (_) {
          return showDeckIndex(targetDeckPos + direction, direction, attempts + 1);
        }

        if (token !== transitionToken) return;
        deckPos = targetDeckPos;

        const nextLayer = 1 - activeLayer;
        const nextSlide = slides[nextLayer];
        const prevSlide = slides[activeLayer];

        const backdrop = nextSlide.querySelector(".slide-backdrop");
        const fgImg = nextSlide.querySelector(".slide-img");
        backdrop.style.backgroundImage = 'url("' + url + '")';
        fgImg.src = url;

        if (!hasShownFirst) {
          nextSlide.classList.add("first-load");
          hasShownFirst = true;
          setTimeout(() => nextSlide.classList.remove("first-load"), 800);
        }

        nextSlide.classList.add("active");
        prevSlide.classList.remove("active");
        activeLayer = nextLayer;

        // Warm cache with upcoming photo
        const lookaheadPos = (deckPos + 1) % deck.length;
        const warmImg = new Image();
        warmImg.referrerPolicy = "no-referrer";
        warmImg.src = photoUrl(deck[lookaheadPos]);

        scheduleNextSlide();
      }

      function scheduleNextSlide() {
        clearTimeout(slideTimer);
        if (!paused) {
          slideTimer = setTimeout(() => {
            showDeckIndex(deckPos + 1, 1);
          }, SLIDE_INTERVAL_MS);
        }
      }

      function stepSlide(delta) {
        clearTimeout(slideTimer);
        showDeckIndex(deckPos + delta, delta >= 0 ? 1 : -1);
      }

      function togglePause() {
        paused = !paused;
        btnPlay.innerHTML = paused ? "&#9654;" : "&#10074;&#10074;";
        btnPlay.setAttribute("aria-label", paused ? "Resume slideshow" : "Pause slideshow");
        if (paused) {
          clearTimeout(slideTimer);
        } else {
          scheduleNextSlide();
        }
      }

      // Auto-hide controls & cursor when idle
      let idleTimer = null;
      function wakeUI() {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          document.body.classList.add("idle");
        }, 2600);
      }

      ["mousemove", "mousedown", "touchstart", "keydown"].forEach(evt => {
        window.addEventListener(evt, wakeUI, { passive: true });
      });

      // Control bindings
      btnPrev.addEventListener("click", () => stepSlide(-1));
      btnNext.addEventListener("click", () => stepSlide(1));
      btnPlay.addEventListener("click", togglePause);

      btnFormat.addEventListener("click", () => {
        prefs.use24h = !prefs.use24h;
        localStorage.setItem("orod_clock_24h", prefs.use24h ? "1" : "0");
        applyPrefs();
      });

      btnFit.addEventListener("click", () => {
        prefs.fillMode = !prefs.fillMode;
        localStorage.setItem("orod_clock_fill", prefs.fillMode ? "1" : "0");
        applyPrefs();
      });

      btnPos.addEventListener("click", () => {
        const nextIdx = (POSITIONS.indexOf(prefs.pos) + 1) % POSITIONS.length;
        prefs.pos = POSITIONS[nextIdx];
        localStorage.setItem("orod_clock_pos", prefs.pos);
        applyPrefs();
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      }
      btnFs.addEventListener("click", toggleFullscreen);

      window.addEventListener("keydown", e => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePause();
        } else if (e.code === "ArrowRight") {
          stepSlide(1);
        } else if (e.code === "ArrowLeft") {
          stepSlide(-1);
        } else if (e.key === "t" || e.key === "T") {
          btnFormat.click();
        } else if (e.key === "c" || e.key === "C") {
          btnFit.click();
        } else if (e.key === "p" || e.key === "P") {
          btnPos.click();
        } else if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        }
      });

      // Initialize
      applyPrefs();
      scheduleClock();
      wakeUI();
      showDeckIndex(0, 1);
    })();
  </script>
</body>
</html>
